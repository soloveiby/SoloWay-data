name: Расписания из Google-таблиц (Kotlin)

# Факультеты, чьи таблицы разбирает тот же код, что и Android-приложение (sources/*.json с "adapter": "kotlin_…").
on:
  schedule:
    - cron: "17 * * * *"        # раз в час
  workflow_dispatch:
  push:
    paths: ["kotlin/**", "sources/**", ".github/workflows/kotlin.yml"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Разобрать
        working-directory: kotlin
        run: |
          for f in ../sources/*.json; do
            if grep -q '"adapter": "kotlin_' "$f"; then ./gradlew -q run --args="$(basename "$f" .json) ../feeds ../sources"; fi
          done
      - name: Сохранить, если что-то поменялось
        run: |
          git config user.name "soloweek-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Расписания (Kotlin): $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q
          git push
