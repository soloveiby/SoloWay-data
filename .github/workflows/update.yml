name: Обновить расписания

on:
  schedule:
    - cron: "*/30 * * * *"      # каждые 30 минут (GitHub может запускать с опозданием на несколько минут)
  workflow_dispatch:            # кнопка «Run workflow» — обновить вручную
  push:
    paths: ["pipeline/**", "sources/**"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Тесты разбора
        run: python -m pytest -q pipeline/tests
      - name: Скачать и разобрать
        run: python pipeline/run.py
      - name: Сохранить, если что-то поменялось
        run: |
          git config user.name "soloweek-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds state
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Расписания: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
