name: БГЭУ — расписания

on:
  schedule:
    - cron: "0 3,15 * * *"      # 06:00 и 18:00 по Минску: полный обход ~40 минут (сайт отдаёт семестр ~5 с на группу)
  workflow_dispatch:            # кнопка «Run workflow» — обновить вручную
  push:
    paths: ["pipeline/adapters/bseu_api.py", "sources/bseu.json"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Тесты разбора
        run: python -m pytest -q pipeline/tests
      - name: Скачать и разобрать
        run: python pipeline/run.py --only=bseu
      - name: Сохранить, если что-то поменялось
        run: |
          git config user.name "soloweek-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds state
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Расписания: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q
          git push
